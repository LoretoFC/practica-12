<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sueldos de trabajadores</title>
    <style>
      body {
        margin: 0;
        padding: 30px 15px;
        background: #fdf2f2;
        color: #222;
        font-family: Arial, Helvetica, sans-serif;
      }

      h2 {
        text-align: center;
        color: #991b1b;
        margin-bottom: 25px;
      }

      form {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 650px;
        margin: 0 auto 40px auto;
        padding: 20px;
        background: #fff;
        border: 2px solid #b91c1c;
      }

      label {
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 5px;
      }

      input {
        font-size: 14px;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #999;
      }

      button {
        align-self: flex-start;
        padding: 10px 20px;
        background-color: #b91c1c;
        color: #fff;
        font-size: 15px;
        font-weight: bold;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background-color: #7f1d1d;
      }

      table {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        border-collapse: collapse;
        background: #fff;
      }

      th,
      td {
        padding: 8px 10px;
        border: 1px solid #777;
        text-align: center;
        font-size: 14px;
      }

      th {
        background-color: #b91c1c;
        color: #fff;
      }

      #tbody tr:nth-child(odd) {
        background-color: #fff;
      }

      #tbody tr:nth-child(even) {
        background-color: #fca5a5;
      }

      img {
        width: 60px;
        height: 60px;
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <h2>Control de Sueldos y Empleados</h2>

    <!-- Formulario de entrada -->
    <form class="form">
      <label for="nombre">Nombre del trabajador:</label>
      <input
        name="nombre"
        id="nombre"
        type="text"
        placeholder="Ej. Juan Pérez"
        autocomplete="off"
        required
      />

      <label for="rfc">RFC:</label>
      <input
        name="rfc"
        id="rfc"
        type="text"
        placeholder="RFC del empleado"
        required
      />

      <label for="antiguedad">Años de antigüedad:</label>
      <input
        name="antiguedad"
        id="antiguedad"
        type="number"
        placeholder="Ej. 5"
        required
      />

      <label for="dias">Días trabajados en la quincena:</label>
      <input
        name="dias"
        id="dias"
        type="number"
        placeholder="Ej. 15"
        required
      />

      <button type="submit">Guardar Datos</button>
    </form>

    <!-- Tabla para mostrar los resultados -->
    <table id="tabla">
      <thead>
        <tr>
          <th>No.</th>
          <th>Nombre</th>
          <th>Días Trab.</th>
          <th>Antigüedad</th>
          <th>Bono</th>
          <th>Monto Bono</th>
          <th>Sueldo Total</th>
          <th>Foto</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <script>
      // Solicitar el número de filas a inicializar
      const lineas = Number(prompt("Ingresa el número de filas para la tabla:"));
      const $tbody = document.getElementById("tbody");

      // Generar filas vacías en la tabla
      for (let i = 1; i <= lineas; i++) {
        $tbody.innerHTML += `
          <tr name="persona-${i}">
            <td>${i}</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>`;
      }

      const $form = document.querySelector(".form");
      let id = 1;

      // Procesar el envío de datos
      $form.addEventListener("submit", (evt) => {
        evt.preventDefault();

        // Localizar la fila correspondiente
        const $fila = $tbody.querySelector(`[name="persona-${id}"]`);
        if (!$fila) {
          alert("Ya completaste todas las filas disponibles.");
          return;
        }

        // Extraer valores del formulario
        let form = new FormData($form);
        let nombre = form.get("nombre");
        let antiguedad = Number(form.get("antiguedad"));
        let dias = Number(form.get("dias"));
        let rfc = form.get("rfc");

        // Cálculo de sueldo quincenal y validación de bono
        let sueldo_base = 15000;
        let bono = 1000;
        let tiene_bono = "No";
        let sueldo_quincena = (sueldo_base / 15) * dias;

        if (antiguedad >= 10) {
          tiene_bono = "Sí";
          sueldo_quincena = sueldo_quincena + bono;
        }

        // Asignar valores calculados a las celdas
        $fila.cells[0].textContent = id;
        $fila.cells[1].textContent = nombre;
        $fila.cells[2].textContent = dias;
        $fila.cells[3].textContent = `${antiguedad} años`;
        $fila.cells[4].textContent = tiene_bono;
        $fila.cells[5].textContent = tiene_bono === "Sí" ? `$${bono}` : "$0";
        $fila.cells[6].textContent = `$${sueldo_quincena.toFixed(2)}`;

        // Crear e insertar elemento de imagen con el nombre del RFC
        const $foto = document.createElement("img");
        $foto.src = `${rfc}.jpeg`;
        $foto.alt = "Foto empleado";
        $fila.cells[7].replaceChildren($foto);

        // Reiniciar formulario e incrementar contador
        $form.reset();
        id += 1;
      });
    </script>
  </body>
</html>
